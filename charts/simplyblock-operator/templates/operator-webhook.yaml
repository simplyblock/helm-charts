{{- if .Values.operator.enabled }}
{{- $ns := .Release.Namespace }}
{{- $svcName := "simplyblock-operator-webhook" }}
{{- $secretName := "simplyblock-operator-webhook-certs" }}
{{- $cn := printf "%s.%s.svc" $svcName $ns }}

{{/*
Reuse existing cert if the Secret already exists so that helm upgrade does not
rotate the CA and invalidate the caBundle injected into the webhook config.
*/}}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $ca := "" }}
{{- $cert := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data }}
  {{- $ca   = index $existing.data "ca.crt"  | b64dec }}
  {{- $cert = index $existing.data "tls.crt" | b64dec }}
  {{- $key  = index $existing.data "tls.key" | b64dec }}
{{- else }}
  {{- $caObj   := genCA "simplyblock-operator-webhook-ca" 3650 }}
  {{- $sans    := list $cn (printf "%s.%s.svc.cluster.local" $svcName $ns) }}
  {{- $certObj := genSignedCert $cn nil $sans 3650 $caObj }}
  {{- $ca   = $caObj.Cert }}
  {{- $cert = $certObj.Cert }}
  {{- $key  = $certObj.Key }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
type: kubernetes.io/tls
data:
  ca.crt:  {{ $ca  | b64enc }}
  tls.crt: {{ $cert | b64enc }}
  tls.key: {{ $key  | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
spec:
  ports:
  - name: webhook
    port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app: simplyblock-operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: simplyblock-operator-rebalancer-injector
webhooks:
- name: simplyblock-rebalancer-injector.simplyblock.io
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ $ca | b64enc }}
    service:
      name: {{ $svcName }}
      namespace: {{ $ns }}
      path: /mutate-v1-pod-simplyblock-rebalancer
  failurePolicy: Ignore
  sideEffects: None
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  objectSelector:
    matchExpressions:
    - key: app
      operator: Exists
{{- end }}